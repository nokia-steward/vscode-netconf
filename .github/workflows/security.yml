name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so advisories published after the last change still show up.
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The production dependencies are packaged into the VSIX, so they gate the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit development dependencies (report only)
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=moderate
